# JSON logging profile: activate with SPRING_PROFILES_ACTIVE=json
#
# Uses Spring Boot's built-in structured logging rather than a hand-written
# Logback pattern. A pattern has to escape the message itself, and any log line
# containing a quote or a newline then produces invalid JSON: Hibernate's
# multi-line startup banner alone was enough to break it.
logging.structured.format.console=ecs

# Included in every line, so one request can be followed across log entries.
logging.structured.ecs.service.name=streamline
