# Structured logging profile: activate with SPRING_PROFILES_ACTIVE=json
#
# Emits one JSON object per line in Elastic Common Schema, so a log collector
# can index fields directly instead of regex-parsing a formatted message.
logging.structured.format.console=ecs

# Identifies this service in aggregated logs from several applications.
logging.structured.ecs.service.name=streamline
logging.structured.ecs.service.version=@project.version@
