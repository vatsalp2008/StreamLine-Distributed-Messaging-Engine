# Postgres profile: activate with SPRING_PROFILES_ACTIVE=postgres
#
# H2 is fine for local work and benchmarks, but it is a single-process embedded
# database, so it cannot back more than one server instance. This profile points
# the same Flyway migrations at Postgres instead.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/streamline}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:streamline}
spring.datasource.password=${DB_PASSWORD:streamline}

# Let Hibernate pick the dialect from the connection rather than pinning it.
spring.jpa.database-platform=

# Same contract as the default profile: Flyway owns the schema, Hibernate checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
