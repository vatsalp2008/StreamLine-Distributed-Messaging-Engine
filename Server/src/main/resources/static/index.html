<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamLine</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #171d25;
    --border: #2a3441;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4493f8;
    --ok: #3fb950;
    --error: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  input, button {
    font: inherit;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  input:focus { outline: 1px solid var(--accent); }
  button {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
    cursor: pointer;
    font-weight: 500;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
  #status { margin-left: auto; color: var(--muted); font-size: 13px; }
  #status.live { color: var(--ok); }
  #status.down { color: var(--error); }
  #main { flex: 1; display: flex; min-height: 0; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #members {
    width: 180px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 12px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  #members h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    margin: 0 0 8px;
    font-weight: 600;
  }
  #members ul { list-style: none; margin: 0; padding: 0; }
  #members li { padding: 3px 0; display: flex; align-items: center; gap: 6px; }
  #members li::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
    flex-shrink: 0;
  }
  #members .empty { color: var(--muted); font-size: 13px; }
  .line { display: flex; gap: 8px; align-items: baseline; }
  .time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
    flex-shrink: 0;
  }
  .OK .tag { color: var(--ok); border-color: var(--ok); }
  .BROADCAST .tag { color: var(--accent); border-color: var(--accent); }
  .ERROR .tag { color: var(--error); border-color: var(--error); }
  .ERROR .body { color: var(--error); }
  .HISTORY { opacity: .6; }
  .body { word-break: break-word; }
  footer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #text { flex: 1; }
  #searchBar { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #searchBar input { flex: 1; }
  #searchResults { padding: 0 16px; }
  #searchResults .hit { display: flex; gap: 8px; padding: 3px 0; }
  #searchResults .who { color: var(--accent); flex-shrink: 0; }
  #searchResults .none { color: var(--muted); padding: 6px 0; }
</style>
</head>
<body>
<header>
  <h1>StreamLine</h1>
  <input id="user" placeholder="username" value="alice" size="10" maxlength="20">
  <input id="room" placeholder="room" value="1" size="6">
  <input id="token" placeholder="token (if required)" size="16" type="password">
  <button id="connect">Join</button>
  <button id="leave" class="secondary" disabled>Leave</button>
  <span id="status">disconnected</span>
</header>

<div id="main">
  <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
    <div id="searchBar">
      <input id="query" placeholder="Search this room's history" maxlength="200">
      <button id="searchBtn" class="secondary">Search</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>
    <div id="log"></div>
  </div>
  <aside id="members">
    <h2>Members</h2>
    <ul id="memberList"></ul>
  </aside>
</div>

<footer>
  <input id="text" placeholder="Message, then press Enter" maxlength="500" disabled>
  <button id="send" disabled>Send</button>
</footer>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const log = $("log");
  let socket = null;

  function setStatus(text, kind) {
    $("status").textContent = text;
    $("status").className = kind || "";
  }

  // Joined controls whether sending is possible: the server refuses TEXT before JOIN.
  function setJoined(joined) {
    $("connect").disabled = joined;
    $("leave").disabled = !joined;
    $("text").disabled = !joined;
    $("send").disabled = !joined;
    $("user").disabled = joined;
    $("room").disabled = joined;
    $("token").disabled = joined;
  }

  function append(status, body) {
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;

    const line = document.createElement("div");
    line.className = "line " + status;
    line.innerHTML =
      '<span class="time"></span><span class="tag"></span><span class="body"></span>';
    line.querySelector(".time").textContent = new Date().toLocaleTimeString();
    line.querySelector(".tag").textContent = status;
    line.querySelector(".body").textContent = body;
    log.appendChild(line);

    // only follow the tail if the reader was already there
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  // Membership arrives as PRESENCE frames pushed by the server whenever someone
  // joins or leaves, so the client neither polls nor needs the REST API.
  function renderMembers(csv) {
    const list = $("memberList");
    list.innerHTML = "";

    const names = (csv || "").split(",").filter((n) => n.length > 0);
    if (names.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "nobody here";
      list.appendChild(empty);
      return;
    }

    for (const name of names) {
      const item = document.createElement("li");
      item.textContent = name;
      list.appendChild(item);
    }
  }

  function frame(type, text) {
    return JSON.stringify({
      userId: 1,
      username: $("user").value.trim(),
      message: text,
      timestamp: new Date().toISOString(),
      messageType: type
    });
  }

  function connect() {
    const room = encodeURIComponent($("room").value.trim() || "1");
    const scheme = location.protocol === "https:" ? "wss" : "ws";

    // A browser cannot set headers on a WebSocket handshake, so when the server
    // requires a token it has to travel as a query parameter.
    const token = $("token").value.trim();
    const auth = token ? "?token=" + encodeURIComponent(token) : "";

    socket = new WebSocket(scheme + "://" + location.host + "/chat/" + room + auth);

    setStatus("connecting…");

    socket.onopen = () => {
      setStatus("connected", "live");
      socket.send(frame("JOIN", "Joining"));
      setJoined(true);
      $("text").focus();
    };

    socket.onmessage = (event) => {
      let payload;
      try {
        payload = JSON.parse(event.data);
      } catch (e) {
        append("ERROR", event.data);
        return;
      }
      if (payload.status === "PRESENCE") {
        renderMembers(payload.message);
        return;
      }

      append(payload.status || "OK", payload.message);
    };

    socket.onclose = (event) => {
      // 1006 with nothing sent usually means the handshake itself was refused,
      // which is what a missing or wrong token looks like from the browser.
      setStatus(event.code === 1006 ? "refused - check the token" : "disconnected", "down");
      setJoined(false);
      renderMembers("");
      socket = null;
    };

    socket.onerror = () => setStatus("connection error", "down");
  }

  function send() {
    const text = $("text").value.trim();
    if (!text || !socket) return;
    socket.send(frame("TEXT", text));
    $("text").value = "";
  }

  $("connect").addEventListener("click", connect);

  $("leave").addEventListener("click", () => {
    if (!socket) return;
    socket.send(frame("LEAVE", "Leaving"));
    socket.close();
  });

  $("send").addEventListener("click", send);
  $("text").addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });

  // ---- history search, over the REST API rather than the socket ----

  function authHeaders() {
    const token = $("token").value.trim();
    return token ? { "X-Streamline-Token": token } : {};
  }

  async function runSearch() {
    const q = $("query").value.trim();
    if (!q) return;

    const room = encodeURIComponent($("room").value.trim() || "1");
    const url = "/api/rooms/" + room + "/search?q=" + encodeURIComponent(q) + "&size=50";

    log.innerHTML = "";
    try {
      const response = await fetch(url, { headers: authHeaders() });
      if (!response.ok) {
        append("ERROR", "Search failed: " + response.status
          + (response.status === 401 ? " (token required)" : ""));
        return;
      }

      const page = await response.json();
      if (page.messages.length === 0) {
        append("OK", "No messages match \"" + q + "\"");
        return;
      }

      // results are newest first; show them oldest first so they read like chat
      for (const msg of page.messages.slice().reverse()) {
        append("HISTORY", msg.username + ": " + msg.message);
      }
      append("OK", "Found " + page.totalMessages + " match(es)");
    } catch (e) {
      append("ERROR", "Search failed: " + e.message);
    }
  }

  $("searchBtn").addEventListener("click", runSearch);
  $("query").addEventListener("keydown", (e) => {
    if (e.key === "Enter") runSearch();
  });
  $("clearBtn").addEventListener("click", () => {
    $("query").value = "";
    log.innerHTML = "";
  });

  setJoined(false);
  renderMembers("");
})();
</script>
</body>
</html>
