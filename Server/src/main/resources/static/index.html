<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamLine</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #171d25;
    --border: #2a3441;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4493f8;
    --ok: #3fb950;
    --error: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  input, button {
    font: inherit;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  input:focus { outline: 1px solid var(--accent); }
  button {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
    cursor: pointer;
    font-weight: 500;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
  #status { margin-left: auto; color: var(--muted); font-size: 13px; }
  #status.live { color: var(--ok); }
  #status.down { color: var(--error); }
  #main { flex: 1; display: flex; min-height: 0; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #members {
    width: 180px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 12px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  #members h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    margin: 0 0 8px;
    font-weight: 600;
  }
  #members ul { list-style: none; margin: 0; padding: 0; }
  #members li { padding: 3px 0; display: flex; align-items: center; gap: 6px; }
  #members li::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
    flex-shrink: 0;
  }
  #members .empty { color: var(--muted); font-size: 13px; }
  .line { display: flex; gap: 8px; align-items: baseline; }
  .time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
    flex-shrink: 0;
  }
  .OK .tag { color: var(--ok); border-color: var(--ok); }
  .BROADCAST .tag { color: var(--accent); border-color: var(--accent); }
  .ERROR .tag { color: var(--error); border-color: var(--error); }
  /* Informational frames: readable but visibly secondary to actual chat. */
  .PRESENCE .tag, .TYPING .tag { color: var(--muted); border-color: var(--border); }
  .PRESENCE, .TYPING { opacity: .7; }
  .ERROR .body { color: var(--error); }
  .HISTORY { opacity: .6; }
  /* A line stays dimmed until the server confirms the write. */
  .pending { opacity: .55; }
  .stored { color: var(--ok); font-size: 11px; margin-left: 4px; }
  /* A deleted message keeps its place so the conversation still reads. */
  .redacted .body { text-decoration: line-through; color: var(--muted); }
  /* Marks a line whose text was changed after it was sent. */
  .edited .body::after { content: " (edited)"; color: var(--muted); font-size: 11px; }
  .redacted .stored { color: var(--error); }
  .body { word-break: break-word; }
  footer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #text { flex: 1; }
  #typing {
    height: 18px;
    padding: 0 16px 4px;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
  }
  #searchBar { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #searchBar input { flex: 1; }
  #searchResults { padding: 0 16px; }
  #searchResults .hit { display: flex; gap: 8px; padding: 3px 0; }
  #searchResults .who { color: var(--accent); flex-shrink: 0; }
  #searchResults .none { color: var(--muted); padding: 6px 0; }
</style>
</head>
<body>
<header>
  <h1>StreamLine</h1>
  <input id="user" placeholder="username" value="alice" size="10" maxlength="20">
  <input id="room" placeholder="room" value="1" size="6">
  <input id="token" placeholder="token (if required)" size="16" type="password">
  <button id="connect">Join</button>
  <button id="leave" class="secondary" disabled>Leave</button>
  <span id="status">disconnected</span>
</header>

<div id="main">
  <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
    <div id="searchBar">
      <input id="query" placeholder="Search this room's history" maxlength="200">
      <button id="searchBtn" class="secondary">Search</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>
    <div id="log"></div>
  </div>
  <aside id="members">
    <h2>Members</h2>
    <ul id="memberList"></ul>
  </aside>
</div>

<div id="typing"></div>

<footer>
  <input id="text" placeholder="Message, then press Enter" maxlength="500" disabled>
  <button id="send" disabled>Send</button>
</footer>

<script src="app.js"></script>
</body>
</html>
