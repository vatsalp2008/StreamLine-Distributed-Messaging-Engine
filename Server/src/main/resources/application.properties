# Server Port
server.port=${SERVER_PORT:8080}

# Finish in-flight requests before the JVM exits instead of dropping connections
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# H2 Database Configuration
# Credentials come from the environment so nothing secret lives in this file.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/streamline}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Create schema on startup
spring.jpa.hibernate.ddl-auto=update

# Batch inserts so a burst of messages costs fewer round trips
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# The async pool is the only writer, so it sets the ceiling on connections needed
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:32}

# Actuator: health and metrics only, kept off the public surface by default
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics}
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.org.springframework=INFO
logging.level.server=${LOG_LEVEL:INFO}

# Message fan-out to other members of a room (disable for load benchmarks)
streamline.broadcast.enabled=${BROADCAST_ENABLED:true}

# Bounded pool for async message persistence
streamline.persistence.core-pool-size=${PERSIST_CORE_POOL:8}
streamline.persistence.max-pool-size=${PERSIST_MAX_POOL:32}
streamline.persistence.queue-capacity=${PERSIST_QUEUE_CAPACITY:10000}

# Per-connection limits
streamline.ws.max-text-bytes=${WS_MAX_TEXT_BYTES:8192}
streamline.ws.max-binary-bytes=${WS_MAX_BINARY_BYTES:8192}
streamline.ws.idle-timeout-ms=${WS_IDLE_TIMEOUT_MS:300000}
streamline.ws.allowed-origins=${WS_ALLOWED_ORIGINS:*}

# Per-session send rate limit (off by default so benchmarks are unaffected)
streamline.rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
streamline.rate-limit.messages-per-second=${RATE_LIMIT_PER_SECOND:20}
streamline.rate-limit.burst-size=${RATE_LIMIT_BURST:40}

# OpenAPI document and Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator. Only the endpoints that are useful in operation are exposed; the
# default set includes diagnostics that should not be public.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
