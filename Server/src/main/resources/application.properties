# Server Port
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/streamline
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Create schema on startup
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.org.springframework=INFO
logging.level.server=DEBUG

# Message fan-out to other members of a room (disable for load benchmarks)
streamline.broadcast.enabled=true

# Bounded pool for async message persistence
streamline.persistence.core-pool-size=8
streamline.persistence.max-pool-size=32
streamline.persistence.queue-capacity=10000
