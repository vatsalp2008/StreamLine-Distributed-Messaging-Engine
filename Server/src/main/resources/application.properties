# Server Port
server.port=${SERVER_PORT:8080}

# Finish in-flight requests before the JVM exits instead of dropping connections
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# H2 Database Configuration
# Credentials come from the environment so nothing secret lives in this file.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/streamline}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway owns the schema; Hibernate only checks that the entities still match it.
# Previously this was ddl-auto=update, which quietly altered tables at startup and
# gave no versioned history of how the schema got to its current shape.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Batch inserts so a burst of messages costs fewer round trips
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# The async pool is the only writer, so it sets the ceiling on connections needed
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:32}

# Actuator: health and metrics only, kept off the public surface by default
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics}
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.org.springframework=INFO
logging.level.server=${LOG_LEVEL:INFO}

# Message fan-out to other members of a room (disable for load benchmarks)
streamline.broadcast.enabled=${BROADCAST_ENABLED:true}

# Bounded pool for async message persistence
streamline.persistence.core-pool-size=${PERSIST_CORE_POOL:8}
streamline.persistence.max-pool-size=${PERSIST_MAX_POOL:32}
streamline.persistence.queue-capacity=${PERSIST_QUEUE_CAPACITY:10000}

# Per-connection limits
streamline.ws.max-text-bytes=${WS_MAX_TEXT_BYTES:8192}
streamline.ws.max-binary-bytes=${WS_MAX_BINARY_BYTES:8192}
streamline.ws.idle-timeout-ms=${WS_IDLE_TIMEOUT_MS:300000}
streamline.ws.allowed-origins=${WS_ALLOWED_ORIGINS:*}

# Per-session send rate limit (off by default so benchmarks are unaffected)
streamline.rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
streamline.rate-limit.messages-per-second=${RATE_LIMIT_PER_SECOND:20}
streamline.rate-limit.burst-size=${RATE_LIMIT_BURST:40}

# OpenAPI document and Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator. Only the endpoints that are useful in operation are exposed; the
# default set includes diagnostics that should not be public.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# Shared-secret access control. Disabled by default; enabling it without a token
# fails startup rather than silently accepting every request.
streamline.auth.enabled=${AUTH_ENABLED:false}
streamline.auth.token=${AUTH_TOKEN:}
streamline.auth.header=${AUTH_HEADER:X-Streamline-Token}
streamline.auth.query-param=${AUTH_QUERY_PARAM:token}
streamline.auth.protect-actuator=${AUTH_PROTECT_ACTUATOR:true}

# A session is held to the username it joined with, and a username may appear
# only once per room. Disable only for load generators that deliberately reuse
# one connection for many synthetic authors.
streamline.identity.strict=${IDENTITY_STRICT:true}
streamline.identity.unique-usernames=${IDENTITY_UNIQUE:true}

# Caps on room state. Room ids come from the connection URL, so without these a
# client can allocate rooms without bound. Zero disables a limit.
streamline.limits.max-rooms=${MAX_ROOMS:1000}
streamline.limits.max-members-per-room=${MAX_MEMBERS_PER_ROOM:500}

# How long stored messages are kept. 0 keeps everything, which is the default so
# that an existing deployment does not start discarding history unasked.
streamline.retention.days=${RETENTION_DAYS:0}
streamline.retention.sweep-interval-ms=${RETENTION_SWEEP_MS:3600000}

# A second frame confirming a message reached storage. Off by default: an OK
# already means accepted, and receipts double server-to-client frames.
streamline.receipts.enabled=${RECEIPTS_ENABLED:false}
