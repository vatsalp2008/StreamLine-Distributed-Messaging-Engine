# Local stack: the server on its own, plus an opt-in benchmark client.
#
#   docker compose up server              # just the server
#   docker compose --profile bench up     # server, then a warm-up benchmark against it
services:
  server:
    build:
      context: ./Server
    image: streamline-server:local
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # fan-out is on by default; turn it off to benchmark acknowledgement latency alone
      BROADCAST_ENABLED: "${BROADCAST_ENABLED:-true}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
    volumes:
      - streamline-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Only starts under the "bench" profile, and waits for the server to be healthy first.
  load-tester:
    profiles: ["bench"]
    build:
      context: ./load-tester
    image: streamline-load-tester:local
    depends_on:
      server:
        condition: service_healthy
    environment:
      STREAMLINE_URL: "ws://server:8080"
      STREAMLINE_THREADS: "${BENCH_THREADS:-32}"
      STREAMLINE_MESSAGES: "${BENCH_MESSAGES:-32000}"

volumes:
  streamline-data:
