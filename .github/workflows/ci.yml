name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a new push to the same branch makes the previous run irrelevant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 'clean' matters: an incremental build can reuse stale classes and pass
      # even when the sources no longer compile from scratch.
      - name: Build and test
        run: mvn -B clean verify --file Server/pom.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: Server/target/surefire-reports/
          if-no-files-found: ignore

  bench-common:
    name: Shared benchmark module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify --file bench-common/pom.xml

  clients:
    name: Benchmark clients compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [load-tester, latency-analyzer]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The clients resolve streamline-bench-common from the local repository,
      # so it has to be installed before they can build.
      - name: Install bench-common
        run: mvn -B clean install -DskipTests --file bench-common/pom.xml

      - name: Build and test ${{ matrix.module }}
        run: mvn -B clean verify --file ${{ matrix.module }}/pom.xml

  smoke:
    name: End-to-end smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Starts the real server and drives it with the real client. The unit
      # tests cover each side in isolation; this is what catches the two halves
      # disagreeing about the protocol, which no amount of mocking would.
      - name: Server accepts every benchmark message
        timeout-minutes: 10
        run: make smoke

      # The run leaves the server log behind; without it a CI-only failure is
      # just an exit code.
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: target/smoke/
          if-no-files-found: ignore

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: target/smoke/
          if-no-files-found: ignore

  postgres-schema:
    name: Schema tests on Postgres
    runs-on: ubuntu-latest
    # The rest of the suite runs on H2, which generates different DDL and
    # accepts SQL Postgres rejects, so this is the only job that says anything
    # about the database the server actually deploys against.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: streamline
          POSTGRES_USER: streamline
          POSTGRES_PASSWORD: streamline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run schema tests
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/streamline
        run: mvn -B test -f Server/pom.xml -Dtest=PostgresSchemaTest

  browser-client:
    name: Browser client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The client's logic was previously checkable only by clicking through it.
      # No install step: the harness stubs the browser APIs it needs.
      - name: Run client tests
        run: node --test 'Server/src/test/js/*.test.js'

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The stack has several profiles; a typo in one of them otherwise only
      # surfaces when somebody tries to start it.
      - name: Validate default services
        run: docker compose config --quiet

      # COMPOSE_PROFILES rather than --profile: the flag is not accepted in that
      # position by every Compose version, the environment variable is.
      #
      # Each profile is checked for the services it is supposed to bring up, not
      # just that the file parses. A profile that names a dependency it does not
      # activate is an invalid project, and "bench" was broken exactly that way
      # after the server moved into its own profile.
      - name: Validate postgres profile
        run: |
          COMPOSE_PROFILES=postgres docker compose config --quiet
          COMPOSE_PROFILES=postgres docker compose config --services | sort > /tmp/postgres.txt
          printf 'postgres\nserver-postgres\n' | diff - /tmp/postgres.txt

      - name: Validate bench profile
        run: |
          COMPOSE_PROFILES=bench docker compose config --quiet
          COMPOSE_PROFILES=bench docker compose config --services | sort > /tmp/bench.txt
          printf 'load-tester\nserver\n' | diff - /tmp/bench.txt

      - name: Validate h2 profile
        run: |
          COMPOSE_PROFILES=h2 docker compose config --quiet
          COMPOSE_PROFILES=h2 docker compose config --services | sort > /tmp/h2.txt
          printf 'server\n' | diff - /tmp/h2.txt

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: Server
          push: false
          tags: streamline-server:ci
