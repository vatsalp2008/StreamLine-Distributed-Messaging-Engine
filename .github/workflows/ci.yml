name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a new push to the same branch makes the previous run irrelevant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 'clean' matters: an incremental build can reuse stale classes and pass
      # even when the sources no longer compile from scratch.
      - name: Build and test
        run: mvn -B clean verify --file Server/pom.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Server/target/surefire-reports/
          if-no-files-found: ignore

  bench-common:
    name: Shared benchmark module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify --file bench-common/pom.xml

  clients:
    name: Benchmark clients compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [load-tester, latency-analyzer]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The clients resolve streamline-bench-common from the local repository,
      # so it has to be installed before they can build.
      - name: Install bench-common
        run: mvn -B clean install -DskipTests --file bench-common/pom.xml

      - name: Build and test ${{ matrix.module }}
        run: mvn -B clean verify --file ${{ matrix.module }}/pom.xml

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: Server
          push: false
          tags: streamline-server:ci
